# .github/workflows/build-release.yml
# BxRGB — Build a standalone executable with PyInstaller and publish a GitHub Release.
#
# The build runs on ubuntu-latest (Linux-only project, uses smbus2 for SMBus/I2C).
# Triggered manually via the "Actions" tab → "Run workflow".
# An optional version string can be provided; otherwise the version is derived
# from the latest git tag.

name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0). Leave empty to use the latest git tag.'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # required to create a GitHub Release

env:
  PYTHON_VERSION: '3.11'
  BINARY_NAME: 'ballistixd'

jobs:
  build-and-release:
    name: Build standalone binary and publish release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe` works for versioning

      # ── 2. Determine version ──────────────────────────────────────────
      - name: Determine release version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Derive from the most recent git tag.
            # `git describe --tags --abbrev=0` returns the latest tag (e.g. v1.2.0).
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              # No tags yet — fall back to a timestamped dev version.
              VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
              echo "⚠  No git tag found, using fallback version: $VERSION"
            else
              # Strip a leading 'v' if present.
              VERSION="${TAG#v}"
            fi
          fi
          # Ensure a leading 'v' for the git tag / release name.
          echo "version=${VERSION}"        >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "release_name=BxRGB v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Release version : ${VERSION}"
          echo "🏷  Git tag         : v${VERSION}"

      # ── 3. Set up Python ──────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 4. Install dependencies ───────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 5. Build with PyInstaller ─────────────────────────────────────
      - name: Build standalone binary
        run: |
          echo "🔨 Running PyInstaller with ballistixd.spec..."
          pyinstaller ballistixd.spec --clean --noconfirm

      # Verify the build output and detect onefile vs onedir
      - name: Inspect build output
        id: build_info
        run: |
          set -e
          BINARY_NAME="${{ env.BINARY_NAME }}"
          DIST_DIR="dist"
          if [ -f "${DIST_DIR}/${BINARY_NAME}" ]; then
            echo "build_type=onefile" >> "$GITHUB_OUTPUT"
            echo "build_path=${DIST_DIR}/${BINARY_NAME}" >> "$GITHUB_OUTPUT"
            echo "✅ onefile binary detected: ${DIST_DIR}/${BINARY_NAME}"
            ls -lh "${DIST_DIR}/${BINARY_NAME}"
          elif [ -d "${DIST_DIR}/${BINARY_NAME}" ]; then
            echo "build_type=onedir" >> "$GITHUB_OUTPUT"
            echo "build_path=${DIST_DIR}/${BINARY_NAME}" >> "$GITHUB_OUTPUT"
            echo "✅ onedir directory detected: ${DIST_DIR}/${BINARY_NAME}"
            ls -lhR "${DIST_DIR}/${BINARY_NAME}" | head -40
          else
            echo "❌ Build output not found at ${DIST_DIR}/${BINARY_NAME}"
            echo "Contents of dist/:"
            ls -la "${DIST_DIR}/" || true
            exit 1
          fi

      # ── 6. Package into tar.gz ────────────────────────────────────────
      # The .spec already bundles static/ via datas, but we always include
      # the static/ folder at the archive root as a safety net — this way
      # the frontend is available even if the onefile extraction fails or
      # the user wants to serve it externally.
      - name: Package release archive
        id: package
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          BINARY_NAME="${{ env.BINARY_NAME }}"
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          BUILD_PATH="${{ steps.build_info.outputs.build_path }}"

          # Staging directory — this is what gets archived.
          STAGE="bxrgb-${VERSION}"
          mkdir -p "${STAGE}"

          if [ "$BUILD_TYPE" = "onefile" ]; then
            # Single binary: copy it directly.
            cp "${BUILD_PATH}" "${STAGE}/"
            # Also copy static/ as a fallback alongside the binary.
            cp -r static "${STAGE}/static"
          else
            # onedir: copy the entire folder (already contains static/ inside).
            cp -r "${BUILD_PATH}" "${STAGE}/"
            # Also copy static/ at the archive root for convenience.
            cp -r static "${STAGE}/static"
          fi

          # Include the systemd service file so the archive is self-contained.
          [ -f ballistix-rgb.service ] && cp ballistix-rgb.service "${STAGE}/" || true

          # Include a small README for the release archive.
          cat > "${STAGE}/README.txt" <<EOF
          BxRGB — Ballistix RGB LED Controller
          Version: ${VERSION}
          Build type: ${BUILD_TYPE}
          Platform: Linux x86_64

          Quick start:
            sudo ./${BINARY_NAME} --add-device 9:0x20

          The static/ folder contains the web frontend. When using the
          onefile binary, it is also bundled inside the executable and
          extracted at runtime; this copy is provided as a fallback.

          Install as a systemd service:
            sudo cp ${BINARY_NAME} /usr/local/bin/
            sudo cp ballistix-rgb.service /etc/systemd/system/
            sudo systemctl enable --now ballistix-rgb
          EOF

          # Create the tar.gz archive.
          ARCHIVE="bxrgb-${VERSION}.tar.gz"
          tar czf "${ARCHIVE}" "${STAGE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "📦 Created archive: ${ARCHIVE}"
          ls -lh "${ARCHIVE}"

      # ── 7. Upload build artifact (for debugging / retention) ──────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxrgb-${{ steps.version.outputs.version }}-build
          path: ${{ steps.package.outputs.archive }}
          retention-days: 30

      # ── 8. Create GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -e

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create (or update) a git tag for this release.
          git tag "${TAG}" 2>/dev/null || true
          git push origin "${TAG}" 2>/dev/null || true

          # Create the release with the tar.gz attached as an asset.
          # `--notes-file` reads from stdin via a temp file.
          RELEASE_NOTES="$(mktemp)"
          cat > "$RELEASE_NOTES" <<EOF
          ## BxRGB ${{ steps.version.outputs.version }}

          ### artefact
          - \`${ARCHIVE}\` — binaire standalone + dossier \`static/\` (frontend web)
          - Type de build : ${{ steps.build_info.outputs.build_type }}
          - Plateforme : Linux x86_64

          ### Installation rapide
          \`\`\`bash
          tar xzf ${ARCHIVE}
          cd bxrgb-${{ steps.version.outputs.version }}
          sudo ./ballistixd --add-device 9:0x20
          \`\`\`

          ### Service systemd
          \`\`\`bash
          sudo cp ballistixd /usr/local/bin/
          sudo cp ballistix-rgb.service /etc/systemd/system/
          sudo systemctl enable --now ballistix-rgb
          \`\`\`
          EOF

          gh release create "${TAG}" \
            --title "${RELEASE_NAME}" \
            --notes-file "$RELEASE_NOTES" \
            "${ARCHIVE}" \
            ${PRERELEASE_FLAG}

          echo "✅ Release ${TAG} created with asset ${ARCHIVE}"